name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    concurrency:
      group: infra-ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate deployment scripts
        run: >-
          shellcheck
          bin/tuf-install-docker
          bin/tuf-config-check
          bin/tuf-cutover-production
          bin/tuf-canary-config-check
          bin/tuf-deploy-backend
          bin/tuf-deploy-frontend
          bin/tuf-deploy-canary
          bin/tuf-recreate
          bin/tuf-sync-infra
          bin/tuf-install-nginx-csp
          bin/tuf-init
          bin/tuf-init-canary
          bin/tuf-init-canary-database
          bin/tuf-provision-mysql-users
          bin/tuf-normalize-runtime-paths
          bin/tuf-seed-production-mapping-hashes

      - name: Prepare Compose validation config
        run: |
          set -euo pipefail

          production_dir="${RUNNER_TEMP}/tuf-config"
          canary_dir="${RUNNER_TEMP}/tuf-canary-config"
          mkdir -p "${production_dir}/certs" "${canary_dir}/certs"

          for source in config/*.env.example; do
            target="${production_dir}/$(basename "${source%.example}")"
            cp "${source}" "${target}"
          done
          for source in config/canary/*.env.example; do
            target="${canary_dir}/$(basename "${source%.example}")"
            cp "${source}" "${target}"
          done

          touch "${production_dir}/certs/elasticsearch.crt"
          touch "${canary_dir}/certs/elasticsearch.crt"

      - name: Validate Compose model
        env:
          TUF_CONFIG_ROOT: ${{ runner.temp }}/tuf-config
        run: >-
          docker compose
          --env-file config/stack.env.example
          --file compose.yml
          config
          --no-env-resolution
          --quiet

      - name: Validate canary Compose model
        env:
          TUF_CONFIG_ROOT: ${{ runner.temp }}/tuf-canary-config
        run: >-
          docker compose
          --env-file config/canary/stack.env.example
          --file compose.yml
          --file compose.canary.yml
          config
          --no-env-resolution
          --quiet

  sync-production:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    concurrency:
      group: tuf-infra-production
      cancel-in-progress: false
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - name: Require production deploy host
        env:
          DEPLOY_HOST: ${{ vars.TUF_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_HOST" ]] || {
            echo "::error::Repository variable TUF_DEPLOY_HOST is required" >&2
            exit 64
          }

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh-runner
          ping: ${{ vars.TUF_DEPLOY_HOST }}

      - name: Configure deploy SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.TUF_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TUF_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_KEY" ]] || {
            echo "::error::secret TUF_DEPLOY_SSH_KEY is empty" >&2
            exit 1
          }
          [[ -n "$KNOWN_HOSTS" ]] || {
            echo "::error::secret TUF_DEPLOY_KNOWN_HOSTS is empty" >&2
            exit 1
          }
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Sync validated infra checkout
        env:
          DEPLOY_HOST: ${{ vars.TUF_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "tuf-deploy@${DEPLOY_HOST}" \
            "sudo /srv/tuf/infra/bin/tuf-sync-infra '${{ github.sha }}'"
