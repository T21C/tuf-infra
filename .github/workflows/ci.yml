name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate deployment scripts
        run: >-
          shellcheck
          bin/tuf-config-check
          bin/tuf-canary-config-check
          bin/tuf-deploy-backend
          bin/tuf-deploy-frontend
          bin/tuf-deploy-canary
          bin/tuf-init
          bin/tuf-init-canary

      - name: Validate Compose model
        run: >-
          docker compose
          --env-file config/stack.env.example
          --file compose.yml
          config
          --no-env-resolution
          --quiet

      - name: Validate canary Compose model
        run: >-
          docker compose
          --env-file config/canary/stack.env.example
          --file compose.yml
          --file compose.canary.yml
          config
          --no-env-resolution
          --quiet
