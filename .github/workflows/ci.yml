name: CI

# pull_request / merge_group: script and Compose validation
# push to main / workflow_dispatch: that plus production sync when enabled
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    concurrency:
      group: infra-ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    # CI_RUNS_ON is one set: ARM64 tuf runner, any tuf runner, or ubuntu-latest.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","ARM64","tuf"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate deployment scripts
        run: >-
          shellcheck
          bin/tuf-install-docker
          bin/tuf-config-check
          bin/tuf-configure-auto-submission
          bin/tuf-send-auto-submission-config
          bin/tuf-bootstrap-runtime-defaults
          bin/tuf-bootstrap-tuf-runtime-defaults
          bin/tuf-cutover-production
          bin/tuf-canary-config-check
          bin/tuf-deploy-backend
          bin/tuf-deploy-frontend
          bin/tuf-deploy-lib.sh
          bin/tuf-deploy-canary
          bin/tuf-stack-reload
          bin/tuf-recreate
          bin/tuf-sync-infra
          bin/tuf-install-nginx-csp
          bin/tuf-init
          bin/tuf-init-canary
          bin/tuf-init-canary-database
          bin/tuf-provision-mysql-users
          bin/tuf-normalize-runtime-paths
          bin/tuf-seed-production-mapping-hashes

      - name: Prepare Compose validation config
        run: |
          set -euo pipefail

          production_dir="${RUNNER_TEMP}/tuf-config"
          canary_dir="${RUNNER_TEMP}/tuf-canary-config"
          mkdir -p "${production_dir}/certs" "${canary_dir}/certs"

          for source in config/*.env.example; do
            target="${production_dir}/$(basename "${source%.example}")"
            cp "${source}" "${target}"
          done
          for source in config/canary/*.env.example; do
            target="${canary_dir}/$(basename "${source%.example}")"
            cp "${source}" "${target}"
          done

          touch "${production_dir}/certs/elasticsearch.crt"
          touch "${canary_dir}/certs/elasticsearch.crt"

      - name: Validate Compose model
        env:
          TUF_CONFIG_ROOT: ${{ runner.temp }}/tuf-config
        run: >-
          docker compose
          --env-file config/stack.env.example
          --file compose.yml
          config
          --no-env-resolution
          --quiet

      - name: Validate canary Compose model
        env:
          TUF_CONFIG_ROOT: ${{ runner.temp }}/tuf-canary-config
        run: >-
          docker compose
          --env-file config/canary/stack.env.example
          --file compose.yml
          --file compose.canary.yml
          config
          --no-env-resolution
          --quiet

  sync-production:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    concurrency:
      group: tuf-infra-production
      cancel-in-progress: false
    # CI_RUNS_ON is one set: ARM64 tuf runner, any tuf runner, or ubuntu-latest.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","ARM64","tuf"]') }}
    steps:
      - name: Require production deploy host
        env:
          DEPLOY_HOST: ${{ vars.TUF_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_HOST" ]] || {
            echo "::error::Repository variable TUF_DEPLOY_HOST is required" >&2
            exit 64
          }

      - name: Check whether deploy host is already reachable
        id: tailscale_reachability
        env:
          DEPLOY_HOST: ${{ vars.TUF_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_HOST" ]] || {
            echo "::error::Repository variable TUF_DEPLOY_HOST is required" >&2
            exit 64
          }

          reachable=false

          # --until-direct defaults to true and treats a DERP path as failure.
          # SSH works over a relay, so one pong by either path is enough.
          tailscale_ping() {
            local -a prefix=("$@")
            local -a args=(ping -c 1 "$DEPLOY_HOST")
            local help
            help=$("${prefix[@]}" tailscale ping --help 2>&1 || true)
            if grep -q -- '--until-direct' <<<"$help"; then
              args=(ping -c 1 --timeout 5s --until-direct=false "$DEPLOY_HOST")
            fi
            timeout 20 "${prefix[@]}" tailscale "${args[@]}"
          }

          if command -v tailscale >/dev/null 2>&1; then
            if tailscale_ping; then
              reachable=true
            elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1 && tailscale_ping sudo -n; then
              reachable=true
            fi
          fi

          if [[ "$reachable" == true ]]; then
            echo "Tailscale can already reach ${DEPLOY_HOST}; keeping the current login"
          else
            echo "Tailscale cannot reach ${DEPLOY_HOST}; logging in"
          fi
          printf 'reachable=%s\n' "$reachable" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        if: ${{ steps.tailscale_reachability.outputs.reachable != 'true' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh-runner
          ping: ${{ vars.TUF_DEPLOY_HOST }}

      - name: Configure deploy SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.TUF_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TUF_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_KEY" ]] || {
            echo "::error::secret TUF_DEPLOY_SSH_KEY is empty" >&2
            exit 1
          }
          [[ -n "$KNOWN_HOSTS" ]] || {
            echo "::error::secret TUF_DEPLOY_KNOWN_HOSTS is empty" >&2
            exit 1
          }
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Sync validated infra checkout
        env:
          DEPLOY_HOST: ${{ vars.TUF_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "tuf-deploy@${DEPLOY_HOST}" \
            "sudo /srv/tuf/infra/bin/tuf-sync-infra '${{ github.sha }}'"
