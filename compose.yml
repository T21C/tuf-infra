name: ${TUF_COMPOSE_PROJECT_NAME:-tuf}

x-backend-service: &backend-service
  image: ghcr.io/t21c/tuf-backend:${TUF_BACKEND_IMAGE_TAG:?set TUF_BACKEND_IMAGE_TAG in stack.env}
  network_mode: host
  user: "${TUF_RUNTIME_UID:-10001}:${TUF_RUNTIME_GID:-10001}"
  init: true
  read_only: true
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Default scratch; services that need more (puppeteer) override. tmpfs counts toward mem_limit.
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m,uid=${TUF_RUNTIME_UID:-10001},gid=${TUF_RUNTIME_GID:-10001},mode=1770
  env_file:
    - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/common.env
  environment:
    NODE_ENV: production
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  frontend:
    image: ghcr.io/t21c/t21c-web-frontend:${TUF_FRONTEND_IMAGE_TAG:?set TUF_FRONTEND_IMAGE_TAG in stack.env}
    user: "${TUF_RUNTIME_UID:-10001}:${TUF_RUNTIME_GID:-10001}"
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${TUF_FRONTEND_HOST_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,uid=${TUF_RUNTIME_UID:-10001},gid=${TUF_RUNTIME_GID:-10001},mode=1770
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  api:
    <<: *backend-service
    command: ["node", "dist/app.js"]
    # Puppeteer uses /tmp (--disable-dev-shm-usage); keep headroom under mem_limit.
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,uid=${TUF_RUNTIME_UID:-10001},gid=${TUF_RUNTIME_GID:-10001},mode=1770
    environment:
      NODE_ENV: production
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-application-credentials.json
      # Cap V8 so Chromium/sharp/native buffers retain cgroup headroom (exit 137 = cgroup OOM).
      NODE_OPTIONS: --max-old-space-size=1280
    env_file:
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/common.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/redis.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/storage.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/api.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/thumbnail-worker.env
    volumes:
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/cache:/srv/tuf/data/cache
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/thumbnails:/srv/tuf/data/thumbnails
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/logs:/srv/tuf/data/logs
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/cdn-temp:/srv/tuf/data/cdn-temp
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/backups:/srv/tuf/data/backups
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/mapping-hashes:/app/mapping-hashes
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/certs/elasticsearch.crt:/run/secrets/elasticsearch-ca.crt:ro
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/secrets/google-application-credentials.json:/run/secrets/google-application-credentials.json:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PROD_PORT||process.env.PORT||3000)+'/v2/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      # A mapping/indexer change can require a one-time full production reindex
      # before the API starts listening. The 2 CPU host needs several minutes.
      start_period: 10m
    # Was 1536m; Node+Chromium+ES under load OOM-killed (exit 137). memswap_limit
    # = mem + ~768m swap cushion (requires host swap; else equals mem_limit behavior).
    mem_limit: 2560m
    memswap_limit: 3328m
    pids_limit: 512

  thumbnail-worker:
    <<: *backend-service
    command: ["node", "dist/externalServices/thumbnailWorker/app.js"]
    env_file:
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/common.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/redis.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/thumbnail-worker.env
    volumes:
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/cache:/srv/tuf/data/cache
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/thumbnails:/srv/tuf/data/thumbnails
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/logs:/srv/tuf/data/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.THUMBNAIL_WORKER_PORT||3891)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    cpus: 0.75
    mem_limit: 768m
    memswap_limit: 1024m
    pids_limit: 128

  cdn:
    <<: *backend-service
    command: ["node", "dist/externalServices/cdnService/app.js"]
    # Heavy scratch lives on the cdn-temp volume; keep tmpfs small vs mem_limit.
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,uid=${TUF_RUNTIME_UID:-10001},gid=${TUF_RUNTIME_GID:-10001},mode=1770
    environment:
      NODE_ENV: production
      # Leave room for sharp/native + zip buffers (exit 134 = V8 abort / heap OOM).
      NODE_OPTIONS: --max-old-space-size=1024
    env_file:
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/common.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/storage.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/cdn.env
    volumes:
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/cdn-temp:/srv/tuf/data/cdn-temp
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/logs:/srv/tuf/data/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.CDN_PORT||3001)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    # Was 1024m; image/zip work aborted under pressure (exit 134).
    mem_limit: 1536m
    memswap_limit: 2048m
    pids_limit: 384

  cdc:
    <<: *backend-service
    command: ["node", "dist/externalServices/cdcService/app.js"]
    env_file:
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/common.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/redis.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/cdc.env
    volumes:
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/logs:/srv/tuf/data/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.CDC_HEALTH_PORT||3990)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    mem_limit: 384m
    memswap_limit: 512m
    pids_limit: 192

  health:
    <<: *backend-service
    command: ["node", "dist/externalServices/healthService/startHealthService.js"]
    env_file:
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/common.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/health.env
    volumes:
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/logs:/srv/tuf/data/logs
    depends_on:
      api:
        condition: service_healthy
      cdn:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.HEALTH_PORT||3883)+'/health/api').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    mem_limit: 256m
    memswap_limit: 320m
    pids_limit: 128

  # One-shot schema migration, not part of the running stack. The profile keeps it out
  # of `compose up`; tuf-deploy-backend invokes it with `compose run --rm` after the new
  # image is pulled and before services are recreated.
  migrate:
    <<: *backend-service
    profiles: ["tools"]
    restart: "no"
    command: ["node", "node_modules/sequelize-cli/lib/sequelize", "db:migrate", "--env", "production"]
    env_file:
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/common.env
    mem_limit: 512m
    memswap_limit: 640m
    pids_limit: 128
