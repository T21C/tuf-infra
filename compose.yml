name: ${TUF_COMPOSE_PROJECT_NAME:-tuf}

x-backend-service: &backend-service
  image: ghcr.io/t21c/tuf-backend:${TUF_BACKEND_IMAGE_TAG:?set TUF_BACKEND_IMAGE_TAG in stack.env}
  network_mode: host
  user: "${TUF_RUNTIME_UID:-10001}:${TUF_RUNTIME_GID:-10001}"
  init: true
  read_only: true
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Default scratch; services that need more (puppeteer) override. tmpfs counts toward mem_limit.
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m,uid=${TUF_RUNTIME_UID:-10001},gid=${TUF_RUNTIME_GID:-10001},mode=1770
  env_file:
    - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/common.env
  environment:
    NODE_ENV: production
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  frontend:
    image: ghcr.io/t21c/t21c-web-frontend:${TUF_FRONTEND_IMAGE_TAG:?set TUF_FRONTEND_IMAGE_TAG in stack.env}
    user: "${TUF_RUNTIME_UID:-10001}:${TUF_RUNTIME_GID:-10001}"
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${TUF_FRONTEND_HOST_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,uid=${TUF_RUNTIME_UID:-10001},gid=${TUF_RUNTIME_GID:-10001},mode=1770
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  api:
    <<: *backend-service
    command: ["node", "dist/app.js"]
    # validateArchiveBuffer writes the zip to /tmp. The previous 512m mount filled
    # and left a 512MiB archive-validate-*.zip behind. 16g is the mount cap.
    # tmpfs is charged to mem_limit, so the memory cap below must cover it.
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16g,uid=${TUF_RUNTIME_UID:-10001},gid=${TUF_RUNTIME_GID:-10001},mode=1770
    environment:
      NODE_ENV: production
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-application-credentials.json
      # Cap V8 so Chromium/sharp/native buffers retain cgroup headroom (exit 137 = cgroup OOM).
      NODE_OPTIONS: --max-old-space-size=1536
    env_file:
      # DB_USER is API/migrate (schema ALL). backup.env is dump/restore only.
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/common.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/backup.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/redis.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/storage.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/api.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/thumbnail-worker.env
    volumes:
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/cache:/srv/tuf/data/cache
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/thumbnails:/srv/tuf/data/thumbnails
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/logs:/srv/tuf/data/logs
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/cdn-temp:/srv/tuf/data/cdn-temp
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/backups:/srv/tuf/data/backups
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/mapping-hashes:/app/mapping-hashes
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/certs/elasticsearch.crt:/run/secrets/elasticsearch-ca.crt:ro
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/secrets/google-application-credentials.json:/run/secrets/google-application-credentials.json:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PROD_PORT||process.env.PORT||3000)+'/v2/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      # A mapping/indexer change can require a one-time full production reindex
      # before the API starts listening. Leave several minutes even on 4 OCPU.
      start_period: 10m
    # 16g /tmp plus ~2g for the Node process. tmpfs pages count toward this cap;
    # a 6g limit would OOM the container while the mount still looked empty.
    # A full 16g validation will push a 24GB host into swap (ES, MySQL, CDN).
    # memswap_limit = mem + ~768m swap cushion (requires host swap).
    mem_limit: 18432m
    memswap_limit: 19200m
    pids_limit: 512

  thumbnail-worker:
    <<: *backend-service
    command: ["node", "dist/externalServices/thumbnailWorker/app.js"]
    env_file:
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/common.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/redis.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/thumbnail-worker.env
    volumes:
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/cache:/srv/tuf/data/cache
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/thumbnails:/srv/tuf/data/thumbnails
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/logs:/srv/tuf/data/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.THUMBNAIL_WORKER_PORT||3891)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    # One Chromium render at a time; 1.0 OCPU is enough burst without crowding pack 7z.
    cpus: 1.0
    mem_limit: 1024m
    memswap_limit: 1280m
    pids_limit: 128

  bilibili-proxy:
    <<: *backend-service
    command: ["node", "dist/externalServices/bilibiliProxy/app.js"]
    env_file:
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/common.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/redis.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/bilibili-proxy.env
    volumes:
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/logs:/srv/tuf/data/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.BILIBILI_PROXY_PORT||3892)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 640m
    pids_limit: 128

  cdn:
    <<: *backend-service
    command: ["node", "dist/externalServices/cdnService/app.js"]
    # Heavy scratch lives on the cdn-temp volume; keep tmpfs small vs mem_limit.
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,uid=${TUF_RUNTIME_UID:-10001},gid=${TUF_RUNTIME_GID:-10001},mode=1770
    environment:
      NODE_ENV: production
      # Leave room for sharp/native + zip buffers (exit 134 = V8 abort / heap OOM).
      NODE_OPTIONS: --max-old-space-size=1536
      # Match pack extract overlap (fs + crypto) without matching unbounded 7z fan-out.
      UV_THREADPOOL_SIZE: "4"
    env_file:
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/common.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/storage.env
      # cdn.env DB_USER/DB_PASSWORD override common.env (DML-only MySQL role).
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/cdn.env
    volumes:
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/cdn-temp:/srv/tuf/data/cdn-temp
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/logs:/srv/tuf/data/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.CDN_PORT||3001)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    # Was 1024m; image/zip work aborted under pressure (exit 134).
    mem_limit: 5120m
    memswap_limit: 5888m
    pids_limit: 512
    # 4 OCPU Ampere (4 cores) / 24GB. Pack 7z children inherit this cgroup.
    # 2.0 leaves ≥2 cores for API + MySQL + ES + Nginx when thumbnail is idle
    # (≥1 core if a Chromium render overlaps a pack job).
    cpus: 2.0

  cdc:
    <<: *backend-service
    command: ["node", "dist/externalServices/cdcService/app.js"]
    env_file:
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/common.env
      # CDC_DB_USER in cdc.env is the binlog reader; must not be DB_USER.
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/redis.env
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/cdc.env
    volumes:
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/logs:/srv/tuf/data/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.CDC_HEALTH_PORT||3990)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    mem_limit: 384m
    memswap_limit: 512m
    pids_limit: 192

  health:
    <<: *backend-service
    command: ["node", "dist/externalServices/healthService/startHealthService.js"]
    env_file:
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/common.env
      # health.env DB_USER/DB_PASSWORD override common.env (probe + latency samples).
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/health.env
    volumes:
      - ${TUF_DATA_ROOT:-/srv/tuf/data}/logs:/srv/tuf/data/logs
    depends_on:
      api:
        condition: service_healthy
      cdn:
        condition: service_healthy
      bilibili-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.HEALTH_PORT||3883)+'/health/api').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    mem_limit: 256m
    memswap_limit: 320m
    pids_limit: 128

  # One-shot schema migration, not part of the running stack. The profile keeps it out
  # of `compose up`; tuf-deploy-backend invokes it with `compose run --rm` after the new
  # image is pulled and before services are recreated. Uses common.env DB_USER (schema ALL).
  migrate:
    <<: *backend-service
    profiles: ["tools"]
    restart: "no"
    command: ["node", "node_modules/sequelize-cli/lib/sequelize", "db:migrate", "--env", "production"]
    env_file:
      - ${TUF_CONFIG_ROOT:-/srv/tuf/config}/common.env
    mem_limit: 512m
    memswap_limit: 640m
    pids_limit: 128
